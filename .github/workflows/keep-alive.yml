name: Keep Supabase Alive

on:
  schedule:
    # كل يوم الساعة 06:00 و 18:00 بتوقيت UTC (09:00 و 21:00 بتوقيت القاهرة)
    - cron: "0 6,18 * * *"
  workflow_dispatch: # يسمح بالتشغيل اليدوي من تبويب Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase directly (الأهم — يمنع الإيقاف)
        run: |
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          cat /tmp/body.txt
          if [ "$code" -ge 400 ]; then exit 1; fi

      - name: Ping the site (يبقي Vercel دافئاً)
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "site HTTP %{http_code}\n" \
            "https://knight-of-the-nile.vercel.app/api/keep-alive"